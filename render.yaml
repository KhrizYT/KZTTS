services:
  - type: web
    name: kztts
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'uvicorn main:app --host 0.0.0.0 --port "$PORT"'
    envVars:
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: KICK_CLIENT_ID
        sync: false
      - key: KICK_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
