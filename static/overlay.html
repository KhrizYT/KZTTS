<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KZTTS Source</title>
  <style>
    html,body{margin:0;background:transparent;color:white;font-family:system-ui,sans-serif;overflow:hidden}
    #status{display:none}
  </style>
</head>
<body>
  <div id="status">KZTTS iniciando…</div>
  <script>
    const params = new URLSearchParams(location.search);
    const key = params.get('key');
    const statusEl = document.getElementById('status');
    const queue = [];
    let speaking = false;
    let retry = 1000;

    function setStatus(text){ statusEl.textContent = text; }

    async function speak(item){
      const r = await fetch('/api/tts', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          text:item.text,
          voice:item.voice,
          rate:item.rate,
          pitch:item.pitch,
          overlay_key:key
        })
      });
      if(!r.ok) throw new Error(await r.text());
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.volume = 1;
      await audio.play();
      await new Promise((resolve,reject)=>{
        audio.onended=resolve;
        audio.onerror=()=>reject(new Error('Error reproduciendo audio'));
      });
      URL.revokeObjectURL(url);
    }

    async function drain(){
      if(speaking) return;
      speaking = true;
      while(queue.length){
        const item = queue.shift();
        try{
          setStatus(`[${item.platform}] ${item.user}: ${item.text}`);
          await speak(item);
        }catch(e){
          setStatus(`KZTTS error: ${e.message}`);
          await new Promise(r=>setTimeout(r,1200));
        }
      }
      speaking = false;
      setStatus('KZTTS listo');
    }

    function connect(){
      if(!key){ setStatus('KZTTS: falta key'); return; }
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws/overlay?key=${encodeURIComponent(key)}`);
      ws.onopen = () => { retry = 1000; };
      ws.onmessage = ev => {
        const data = JSON.parse(ev.data);
        if(data.type === 'message'){
          queue.push(data);
          drain();
        } else if(data.type === 'status' || data.type === 'error'){
          setStatus(`KZTTS: ${data.message}`);
        }
      };
      ws.onclose = () => {
        setStatus('KZTTS reconectando…');
        setTimeout(connect, retry);
        retry = Math.min(retry * 1.7, 10000);
      };
      ws.onerror = () => ws.close();
    }

    connect();
  </script>
</body>
</html>
